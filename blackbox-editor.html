<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>블랙박스 영상 추출</title>
    <link rel="stylesheet" href="./web/blackbox-editor.css" />
  </head>
  <body>
    <main class="editor loading">
      <header class="titlebar">
        <h1>블랙박스 영상 추출</h1>
        <span class="anchor-time"></span>
        <button class="window-close" type="button" aria-label="창 닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.3 4 12 10.7 18.7 4 20 5.3 13.3 12l6.7 6.7-1.3 1.3-6.7-6.7L5.3 20 4 18.7l6.7-6.7L4 5.3 5.3 4Z" />
          </svg>
        </button>
      </header>

      <section class="preview">
        <video preload="auto"></video>
        <div class="gap-preview" hidden></div>
        <div class="loading-state"><span>누른 시점을 기준으로 최근 15분 영상을 준비하고 있습니다</span></div>
        <div class="empty-state">
          <div class="empty-state-content">
            <span></span>
            <button class="enable-blackbox" type="button" hidden>블랙박스 켜기</button>
          </div>
        </div>
      </section>

      <section class="editing-panel">
        <div class="timeline-layout">
          <div class="track-length-controls">
            <div class="track-length-buttons">
              <button class="compact-button direct-time" type="button" title="트랙 길이 직접 설정">++</button>
              <button class="compact-button add-time" type="button" title="이전 5분 추가">+5분</button>
            </div>
            <form class="direct-length">
              <label for="track-minutes">블랙박스 조회 길이</label>
              <div class="number-row">
                <input id="track-minutes" aria-label="조회 길이 분" type="number" min="0" step="1" value="15" />
                <span>분</span>
                <input id="track-seconds" aria-label="조회 길이 초" type="number" min="0" step="1" value="0" />
                <span>초</span>
                <button class="compact-button" type="submit">적용</button>
              </div>
            </form>
          </div>

          <div class="timeline-column">
            <div class="time-labels">
              <span class="track-start">-01:00</span>
              <span>편집 창을 연 시점</span>
            </div>
            <div class="timeline" role="slider" aria-label="영상 재생 위치" tabindex="-1">
              <div class="track-gaps" aria-hidden="true"></div>
              <div class="selection-guide" aria-label="추출 범위">
                <span class="selection-handle start" aria-hidden="true"></span>
                <span class="selection-handle end" aria-hidden="true"></span>
              </div>
              <div class="playhead"></div>
            </div>
          </div>

          <div class="playback-row">
            <button class="play-toggle" type="button" aria-label="재생">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4.5v15L19 12 7 4.5Z" />
              </svg>
            </button>
            <span class="current-time">00:00 / 00:00</span>
          </div>

          <div class="extract-duration">
            <label for="extract-minutes">추출 영상 길이</label>
            <input id="extract-minutes" aria-label="추출 영상 길이 분" type="number" min="0" step="1" value="1" />
            <span>분</span>
            <input id="extract-seconds" aria-label="추출 영상 길이 초" type="number" min="0" step="1" value="0" />
            <span>초</span>
            <span class="range-time"></span>
          </div>
        </div>

        <footer class="actions">
          <div class="track-status" hidden>
            <span class="track-duration"></span>
            <strong class="track-usage"></strong>
          </div>
          <span class="notice" role="status"></span>
          <button class="action show-output" type="button">파일 위치</button>
          <button class="action primary extract" type="button" disabled>클립 저장하기</button>
        </footer>
      </section>
    </main>

    <div class="export-modal" hidden>
      <form class="export-dialog">
        <h2>클립 저장 설정</h2>
        <label>
          <span>클립 이름</span>
          <input class="export-name" type="text" maxlength="120" />
        </label>
        <label class="gap-policy-field">
          <span>빈 구간</span>
          <select class="gap-policy">
            <option value="black">검은 화면으로 유지</option>
            <option value="skip">건너뛰고 이어붙이기</option>
          </select>
        </label>
        <label>
          <span>재생속도</span>
          <select class="playback-speed">
            <option value="0.5">0.5배</option>
            <option value="0.75">0.75배</option>
            <option value="1" selected>1배</option>
            <option value="1.25">1.25배</option>
            <option value="1.5">1.5배</option>
            <option value="2">2배</option>
          </select>
        </label>
        <div class="export-dialog-actions">
          <button class="action export-cancel" type="button">취소</button>
          <button class="action primary export-confirm" type="submit">저장 시작</button>
        </div>
      </form>
    </div>
    <script type="module" src="./web/blackbox-editor.js"></script>
  </body>
</html>
