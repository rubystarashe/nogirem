<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>디버프 영역 미리보기</title>
  <style>
    * { box-sizing: border-box }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    .label {
      position: absolute;
      top: 0;
      left: 4px;
      height: 20px;
      padding: 2px 7px;
      border-radius: 3px 3px 0 0;
      color: #fff;
      background: #d64067;
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: -.2px;
    }
    .region {
      position: absolute;
      top: 24px;
      right: 4px;
      bottom: 4px;
      left: 4px;
      border: 2px solid #ff4f7d;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .85), inset 0 0 0 1px rgba(255, 255, 255, .35);
    }
  </style>
</head>
<body>
  <div class="label">디버프 영역</div>
  <div class="region" aria-label="자동인식된 디버프 영역"></div>
</body>
</html>
