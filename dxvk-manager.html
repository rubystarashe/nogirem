<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Vulkan 업데이트 관리</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: #f3f5f7;
        background: #101214;
        font-family: "Pretendard Variable", Pretendard, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .titlebar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 52px;
        height: 46px;
        -webkit-app-region: drag;
      }

      .window-close {
        position: fixed;
        z-index: 11;
        top: 10px;
        right: 13px;
        width: 28px;
        height: 28px;
        padding: 4px;
        border: 0;
        color: #969da2;
        background: transparent;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .window-close:hover {
        color: #fff;
      }

      .window-close svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }

      .manager {
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 42px 26px 22px;
      }

      .heading {
        position: relative;
        margin-bottom: 17px;
      }

      .watermark {
        position: absolute;
        top: -31px;
        left: 50%;
        width: 92px;
        opacity: 0.07;
        pointer-events: none;
        transform: translateX(-50%);
        user-select: none;
        -webkit-user-drag: none;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #8f989d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        line-height: 1.35;
      }

      .description {
        margin: 7px 0 0;
        color: #aeb5b9;
        font-size: 12px;
        line-height: 1.5;
      }

      .source-link {
        display: inline-block;
        margin-top: 4px;
        color: #d8dcde;
        font-size: 11px;
        text-decoration-color: #61686c;
        text-underline-offset: 3px;
        -webkit-app-region: no-drag;
      }

      .source-link:hover {
        color: #fff;
        text-decoration-color: #fff;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .status-card {
        min-height: 104px;
        padding: 14px 15px;
        border: 1px solid #30363a;
        border-radius: 10px;
        background: #191c1e;
      }

      .status-label {
        display: block;
        margin-bottom: 9px;
        color: #8f989d;
        font-size: 10px;
        font-weight: 700;
      }

      .status-value {
        display: block;
        margin-bottom: 5px;
        font-size: 17px;
      }

      .version-select {
        width: 100%;
        height: 29px;
        margin: -2px 0 5px;
        padding: 0 8px;
        border: 1px solid #3a4044;
        border-radius: 6px;
        color: #f3f5f7;
        background: #202427;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        outline: none;
      }

      .version-select:focus {
        border-color: #7f898f;
      }

      .version-select:disabled {
        opacity: 0.55;
      }

      .status-detail {
        display: block;
        color: #8f989d;
        font-size: 11px;
        line-height: 1.45;
      }

      .status-detail.ready {
        color: #67bd78;
      }

      .status-detail.warning {
        color: #e39a42;
      }

      .message {
        min-height: 34px;
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        color: #aeb5b9;
        background: #151719;
        font-size: 11px;
        line-height: 1.4;
      }

      .message.error {
        color: #ef847b;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: auto;
      }

      .action {
        height: 36px;
        padding: 0 15px;
        border: 1px solid #3a4044;
        border-radius: 7px;
        color: #e6eaec;
        background: #202427;
        cursor: pointer;
      }

      .action:hover:not(:disabled) {
        background: #2b3034;
      }

      .action.primary {
        min-width: 138px;
        border-color: #f1f3f4;
        color: #141617;
        background: #f1f3f4;
        font-weight: 700;
      }

      .action.primary:hover:not(:disabled) {
        background: #fff;
      }

      .action:disabled {
        opacity: 0.42;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <button class="window-close" aria-label="창 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.3 4 12 10.7 18.7 4 20 5.3 13.3 12l6.7 6.7-1.3 1.3-6.7-6.7L5.3 20 4 18.7l6.7-6.7L4 5.3 5.3 4Z" />
      </svg>
    </button>
    <main class="manager">
      <header class="heading">
        <img class="watermark" src="./logo2-white-transparent.png" alt="" draggable="false" />
        <p class="eyebrow">VULKAN RUNTIME</p>
        <h1>Vulkan 업데이트 관리</h1>
        <p class="description">공식 최신 정식 릴리즈의 DXVK x64 d3d9.dll을 검증하여 보관합니다.</p>
        <a
          class="source-link"
          href="https://github.com/doitsujin/dxvk"
          target="_blank"
          rel="noopener noreferrer"
        >https://github.com/doitsujin/dxvk</a>
      </header>
      <section class="status-grid" aria-label="DXVK 버전 상태">
        <article class="status-card">
          <span class="status-label">설치된 버전</span>
          <strong class="status-value installed-version">없음</strong>
          <span class="status-detail installed-detail">로컬 파일을 확인하고 있습니다</span>
        </article>
        <article class="status-card">
          <label class="status-label" for="version-select">설치할 버전</label>
          <select class="version-select" id="version-select" disabled>
            <option>확인 전</option>
          </select>
          <span class="status-detail latest-detail">GitHub 릴리즈 확인이 필요합니다</span>
        </article>
      </section>
      <p class="message" role="status"></p>
      <footer class="actions">
        <button class="action primary install" type="button" disabled>다운로드 및 업데이트</button>
      </footer>
    </main>
    <script>
      const installedVersion = document.querySelector(".installed-version")
      const closeButton = document.querySelector(".window-close")
      const installedDetail = document.querySelector(".installed-detail")
      const versionSelect = document.querySelector(".version-select")
      const latestDetail = document.querySelector(".latest-detail")
      const message = document.querySelector(".message")
      const installButton = document.querySelector(".install")
      let busy = false
      let lastStatus = null

      function selectedRelease() {
        return lastStatus?.releases?.find(release => release.version === versionSelect.value)
      }

      function selectionNeedsDownload() {
        const selected = selectedRelease()
        const installed = lastStatus?.installed
        return Boolean(
          selected
          && (
            !installed?.installed
            || !installed.integrity
            || installed.current?.version !== selected.version
            || installed.current?.archiveSha256 !== selected.archiveSha256
          )
        )
      }

      function selectionNeedsInstall() {
        const selected = selectedRelease()
        return selected?.compatibility?.compatible !== false
          && (selectionNeedsDownload()
          || Boolean(
            selected
            && lastStatus?.installed?.current?.version === selected.version
            && !lastStatus?.deployment?.matchesCurrent
          ))
      }

      function updateSelection() {
        const selected = selectedRelease()
        const isLatest = selected?.version === lastStatus?.latest?.version
        latestDetail.textContent = selected?.compatibility?.compatible === false
          ? selected.compatibility.reason
          : selected
          ? selected.localOnly
            ? "로컬 검증 버전 · 최신 여부 확인 불가"
            : isLatest ? "최신 정식 버전" : "이전 정식 버전"
          : "GitHub 릴리즈 확인이 필요합니다"
        latestDetail.className = `status-detail ${
          selected?.compatibility?.compatible === false ? "warning" : selected ? "ready" : ""
        }`
        installButton.disabled = busy || !selectionNeedsInstall()
        installButton.textContent = selectionNeedsDownload()
          ? lastStatus?.installed?.installed ? "선택 버전으로 교체" : "다운로드 및 적용"
          : selectionNeedsInstall() ? "게임에 적용" : "적용됨"
      }

      function errorMessage(error) {
        return error?.message?.replace(/^Error invoking remote method '[^']+': Error: /, "")
          ?? String(error)
      }

      function setBusy(value, text = "") {
        busy = value
        versionSelect.disabled = value || !lastStatus?.releases?.length
        installButton.disabled = value || !selectionNeedsInstall()
        if (text) {
          message.classList.remove("error")
          message.textContent = text
        }
      }

      function render(status) {
        const previousSelection = versionSelect.value
        lastStatus = status
        const installed = status.installed
        if (installed.installed) {
          installedVersion.textContent = installed.current.version
          installedDetail.textContent = status.installedCompatibility?.compatible === false
            ? `${status.installedCompatibility.reason} · 호환 버전으로 교체하세요`
            : installed.integrity
            ? status.deployment.matchesCurrent
              ? "SHA-256 검증·게임 적용 완료"
              : "SHA-256 검증 완료 · 게임 적용 필요"
            : "파일 SHA-256 불일치 · 다시 업데이트하세요"
          installedDetail.className = `status-detail ${
            installed.integrity
              && status.deployment.matchesCurrent
              && status.installedCompatibility?.compatible !== false
              ? "ready"
              : "warning"
          }`
        } else {
          installedVersion.textContent = "없음"
          installedDetail.textContent = installed.current
            ? "기록된 DLL 파일을 찾지 못했습니다"
            : "아직 다운로드한 DXVK가 없습니다"
          installedDetail.className = "status-detail warning"
        }
        versionSelect.replaceChildren()
        if (status.releases?.length) {
          for (const release of status.releases) {
            const option = document.createElement("option")
            option.value = release.version
            option.textContent = release.compatibility?.compatible === false
              ? `${release.version} · 드라이버 호환 안 됨`
              : release.version === status.latest?.version
              ? `${release.version} · 최신`
              : release.version
            versionSelect.append(option)
          }
          const previousRelease = status.releases.find(
            release => release.version === previousSelection,
          )
          versionSelect.value = previousRelease?.compatibility?.compatible !== false
            && previousRelease
            ? previousSelection
            : status.recommended?.version ?? status.latest?.version ?? status.releases[0].version
          versionSelect.disabled = busy
        } else {
          const option = document.createElement("option")
          option.textContent = "확인 전"
          versionSelect.append(option)
          versionSelect.disabled = true
        }
        updateSelection()
      }

      async function loadInstalled() {
        try {
          render(await window.dxvkManager.getStatus())
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        }
      }

      async function checkUpdate() {
        setBusy(true, "GitHub에서 최신 정식 릴리즈를 확인하고 있습니다")
        try {
          render(await window.dxvkManager.checkUpdate())
          if (lastStatus.releaseCheckError) {
            message.classList.add("error")
            message.textContent = lastStatus.deployment.matchesCurrent
              ? "GitHub 연결 실패 · 적용된 DXVK의 최신 여부를 확인할 수 없습니다"
              : "GitHub 연결 실패 · 저장된 DXVK를 게임에 다시 적용할 수 있습니다"
          } else {
            message.classList.remove("error")
            message.textContent = lastStatus.installed.installed
            && lastStatus.installed.integrity
            && !lastStatus.deployment.matchesCurrent
            && lastStatus.installed.current.version === lastStatus.latest?.version
            ? "다운로드된 DXVK를 마비노기 폴더에 적용해야 합니다"
            : lastStatus.updateAvailable
            ? "다운로드할 수 있는 DXVK가 있습니다"
            : "설치된 DXVK가 최신 상태입니다"
          }
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        } finally {
          setBusy(false)
        }
      }

      async function installUpdate() {
        const version = versionSelect.value
        setBusy(true, "DXVK 다운로드·검증 및 마비노기 폴더 적용을 진행하고 있습니다")
        try {
          await window.dxvkManager.installUpdate(version)
          render(await window.dxvkManager.checkUpdate())
          message.classList.remove("error")
          message.textContent = `${version} 검증과 d3d9_dxvk.dll 적용이 완료되었습니다`
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        } finally {
          setBusy(false)
        }
      }

      installButton.addEventListener("click", installUpdate)
      closeButton.addEventListener("click", () => {
        closeButton.disabled = true
        void window.dxvkManager.requestClose()
      })
      versionSelect.addEventListener("change", () => {
        updateSelection()
        const selected = selectedRelease()
        if (!selected) return
        message.classList.remove("error")
        message.textContent = selectionNeedsDownload()
          ? `${selected.version} 버전으로 교체할 수 있습니다`
          : selectionNeedsInstall()
            ? `${selected.version} 버전을 마비노기 폴더에 적용할 수 있습니다`
            : `${selected.version} 버전이 마비노기에 적용되어 있습니다`
      })
      void loadInstalled().then(checkUpdate)
    </script>
  </body>
</html>
