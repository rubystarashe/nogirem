<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>DXVK 업데이트 관리</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: #f3f5f7;
        background: #101214;
        font-family: "Pretendard Variable", Pretendard, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .titlebar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 52px;
        height: 46px;
        -webkit-app-region: drag;
      }

      .window-close {
        position: fixed;
        z-index: 11;
        top: 10px;
        right: 13px;
        width: 28px;
        height: 28px;
        padding: 4px;
        border: 0;
        color: #969da2;
        background: transparent;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .window-close:hover {
        color: #fff;
      }

      .window-close svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }

      .manager {
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 42px 26px 22px;
      }

      .heading {
        position: relative;
        margin-bottom: 17px;
      }

      .watermark {
        position: absolute;
        top: -31px;
        left: 50%;
        width: 92px;
        opacity: 0.07;
        pointer-events: none;
        transform: translateX(-50%);
        user-select: none;
        -webkit-user-drag: none;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #8f989d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        line-height: 1.35;
      }

      .description {
        margin: 7px 0 0;
        color: #aeb5b9;
        font-size: 12px;
        line-height: 1.5;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .status-card {
        min-height: 104px;
        padding: 14px 15px;
        border: 1px solid #30363a;
        border-radius: 10px;
        background: #191c1e;
      }

      .status-label {
        display: block;
        margin-bottom: 9px;
        color: #8f989d;
        font-size: 10px;
        font-weight: 700;
      }

      .status-value {
        display: block;
        margin-bottom: 5px;
        font-size: 17px;
      }

      .status-detail {
        display: block;
        color: #8f989d;
        font-size: 11px;
        line-height: 1.45;
      }

      .status-detail.ready {
        color: #67bd78;
      }

      .status-detail.warning {
        color: #e39a42;
      }

      .storage {
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        color: #979da1;
        background: #151719;
        font-size: 10px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .message {
        min-height: 19px;
        margin: 10px 0 0;
        color: #aeb5b9;
        font-size: 11px;
      }

      .message.error {
        color: #ef847b;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: auto;
      }

      .action {
        height: 36px;
        padding: 0 15px;
        border: 1px solid #3a4044;
        border-radius: 7px;
        color: #e6eaec;
        background: #202427;
        cursor: pointer;
      }

      .action:hover:not(:disabled) {
        background: #2b3034;
      }

      .action.primary {
        min-width: 138px;
        border-color: #f1f3f4;
        color: #141617;
        background: #f1f3f4;
        font-weight: 700;
      }

      .action.primary:hover:not(:disabled) {
        background: #fff;
      }

      .action:disabled {
        opacity: 0.42;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <button class="window-close" aria-label="창 닫기" onclick="window.close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.3 4 12 10.7 18.7 4 20 5.3 13.3 12l6.7 6.7-1.3 1.3-6.7-6.7L5.3 20 4 18.7l6.7-6.7L4 5.3 5.3 4Z" />
      </svg>
    </button>
    <main class="manager">
      <header class="heading">
        <img class="watermark" src="./logo2-white-transparent.png" alt="" draggable="false" />
        <p class="eyebrow">VULKAN RUNTIME</p>
        <h1>DXVK 업데이트 관리</h1>
        <p class="description">공식 최신 정식 릴리즈의 x64 d3d9.dll을 검증하여 보관합니다.</p>
      </header>
      <section class="status-grid" aria-label="DXVK 버전 상태">
        <article class="status-card">
          <span class="status-label">설치된 버전</span>
          <strong class="status-value installed-version">없음</strong>
          <span class="status-detail installed-detail">로컬 파일을 확인하고 있습니다</span>
        </article>
        <article class="status-card">
          <span class="status-label">최신 정식 버전</span>
          <strong class="status-value latest-version">확인 전</strong>
          <span class="status-detail latest-detail">GitHub 릴리즈 확인이 필요합니다</span>
        </article>
      </section>
      <p class="storage"></p>
      <p class="message" role="status"></p>
      <footer class="actions">
        <button class="action check" type="button">업데이트 확인</button>
        <button class="action primary install" type="button" disabled>다운로드 및 업데이트</button>
      </footer>
    </main>
    <script>
      const installedVersion = document.querySelector(".installed-version")
      const installedDetail = document.querySelector(".installed-detail")
      const latestVersion = document.querySelector(".latest-version")
      const latestDetail = document.querySelector(".latest-detail")
      const storage = document.querySelector(".storage")
      const message = document.querySelector(".message")
      const checkButton = document.querySelector(".check")
      const installButton = document.querySelector(".install")
      let busy = false
      let lastStatus = null

      function errorMessage(error) {
        return error?.message?.replace(/^Error invoking remote method '[^']+': Error: /, "")
          ?? String(error)
      }

      function setBusy(value, text = "") {
        busy = value
        checkButton.disabled = value
        installButton.disabled = value || !lastStatus?.latest || !lastStatus?.updateAvailable
        if (text) {
          message.classList.remove("error")
          message.textContent = text
        }
      }

      function render(status) {
        lastStatus = status
        storage.textContent = `저장 위치 · ${status.storagePath}`
        const installed = status.installed
        if (installed.installed) {
          installedVersion.textContent = installed.current.version
          installedDetail.textContent = installed.integrity
            ? "SHA-256 검증 완료"
            : "파일 SHA-256 불일치 · 다시 업데이트하세요"
          installedDetail.className = `status-detail ${installed.integrity ? "ready" : "warning"}`
        } else {
          installedVersion.textContent = "없음"
          installedDetail.textContent = installed.current
            ? "기록된 DLL 파일을 찾지 못했습니다"
            : "아직 다운로드한 DXVK가 없습니다"
          installedDetail.className = "status-detail warning"
        }
        if (status.latest) {
          latestVersion.textContent = status.latest.version
          latestDetail.textContent = status.updateAvailable
            ? "새 버전 또는 파일 복구가 필요합니다"
            : "현재 최신 버전을 사용하고 있습니다"
          latestDetail.className = `status-detail ${status.updateAvailable ? "warning" : "ready"}`
        }
        installButton.disabled = busy || !status.latest || !status.updateAvailable
        installButton.textContent = status.installed.installed ? "다운로드 및 업데이트" : "다운로드"
      }

      async function loadInstalled() {
        try {
          render(await window.dxvkManager.getStatus())
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        }
      }

      async function checkUpdate() {
        setBusy(true, "GitHub에서 최신 정식 릴리즈를 확인하고 있습니다")
        try {
          render(await window.dxvkManager.checkUpdate())
          message.textContent = lastStatus.updateAvailable
            ? "다운로드할 수 있는 DXVK가 있습니다"
            : "설치된 DXVK가 최신 상태입니다"
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        } finally {
          setBusy(false)
        }
      }

      async function installUpdate() {
        setBusy(true, "압축 파일 다운로드·SHA-256 검증·DLL 추출을 진행하고 있습니다")
        try {
          await window.dxvkManager.installUpdate()
          render(await window.dxvkManager.checkUpdate())
          message.classList.remove("error")
          message.textContent = "DXVK 다운로드와 무결성 검증이 완료되었습니다"
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        } finally {
          setBusy(false)
        }
      }

      checkButton.addEventListener("click", checkUpdate)
      installButton.addEventListener("click", installUpdate)
      void loadInstalled().then(checkUpdate)
    </script>
  </body>
</html>
