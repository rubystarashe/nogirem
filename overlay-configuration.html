<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>인터페이스 구성</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    .panel {
      width: 100%;
      height: 100%;
      padding: 12px;
      border: 1px solid #4a505b;
      border-radius: 8px;
      color: #fff;
      background: rgba(28, 31, 37, .97);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
    }
    header {
      margin-bottom: 10px;
      cursor: move;
      user-select: none;
    }
    h1 { margin: 0 0 3px; font-size: 14px }
    p { margin: 0; color: #aeb4bf; font-size: 10px }
    button {
      width: 100%;
      height: 34px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: #2f80bd;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: #3a91ce }
  </style>
</head>
<body>
  <section class="panel">
    <header>
      <h1>인터페이스 구성</h1>
      <p>모든 오버레이 위치를 조정한 뒤 완료하세요.</p>
    </header>
    <button type="button">구성 완료</button>
  </section>
  <script>
    document.querySelector("header").addEventListener("mousedown", event => {
      if (event.button === 0) window.overlayConfiguration.startDrag()
    })
    document.querySelector("button").addEventListener("click", () => {
      window.overlayConfiguration.finish()
    })
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") window.overlayConfiguration.finish()
    })
  </script>
</body>
</html>
