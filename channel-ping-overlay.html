<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>채널별 핑</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      background: transparent;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      color: #f7f5f0;
    }
    main {
      width: 100%;
      height: 100%;
      padding: 20px 24px 14px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 18px;
      background: rgba(15, 17, 20, .84);
      backdrop-filter: blur(14px);
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 760;
      letter-spacing: -.03em;
    }
    p {
      margin: 0;
      color: rgba(247, 245, 240, .65);
      font-size: 12px;
    }
    #updated {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
    }
    #channels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .channel-group {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
    }
    article {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      height: 19px;
      padding: 0 9px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    article:last-child {
      border-bottom: 0;
    }
    article span {
      flex: 0 0 auto;
      color: rgba(247, 245, 240, .58);
      font-size: 10px;
    }
    article strong {
      min-width: 0;
      overflow: hidden;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    article.good strong {
      color: #83d9a0;
    }
    article.normal strong {
      color: #f1d17b;
    }
    article.slow strong,
    article.failed strong {
      color: #f08e81;
    }
    article.waiting strong {
      color: rgba(247, 245, 240, .56);
      font-size: 10px;
    }
    footer {
      margin-top: 10px;
      color: rgba(247, 245, 240, .48);
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main aria-label="채널별 핑">
    <header>
      <div>
        <h1>채널별 핑</h1>
        <p>채널 포트 연결 시간 · 최근 성공 5회 평균</p>
      </div>
      <p id="updated">측정 준비 중</p>
    </header>
    <section id="channels" aria-live="polite"></section>
    <footer>키보드 또는 마우스를 누르면 닫힙니다</footer>
  </main>
  <script>
    const channels = document.querySelector("#channels")
    const updated = document.querySelector("#updated")
    const channelGroups = [[1, 15], [16, 29], [30, 38]]

    function grade(value, failed) {
      if (failed) return "failed"
      if (value == null) return "waiting"
      if (value < 50) return "good"
      if (value < 100) return "normal"
      return "slow"
    }

    function render(status) {
      const items = status.channels || []
      const createCard = item => {
        const card = document.createElement("article")
        const label = document.createElement("span")
        const value = document.createElement("strong")
        label.textContent = `${item.channel}채널`
        card.className = grade(item.averageMs, item.failed)
        card.title = item.endpoint || "접속 정보 없음"
        value.textContent = item.failed
          ? "연결 실패"
          : item.averageMs == null
            ? item.endpoint ? "측정 중" : "정보 없음"
            : `${item.averageMs} ms`
        card.append(label, value)
        return card
      }
      channels.replaceChildren(...channelGroups.map(([start, end]) => {
        const group = document.createElement("section")
        group.className = "channel-group"
        group.setAttribute("aria-label", `${start}채널부터 ${end}채널`)
        for (let channel = start; channel <= end; channel += 1) {
          const item = items.find(entry => entry.channel === channel)
          if (item) group.append(createCard(item))
        }
        return group
      }))
      const times = items
        .map(item => item.measuredAt)
        .filter(value => Number.isFinite(value))
      updated.textContent = times.length
        ? `${new Date(Math.max(...times)).toLocaleTimeString("ko-KR")} 측정`
        : "측정 준비 중"
    }

    async function refresh() {
      try {
        render(await window.channelPing.getStatus())
      } catch {
        updated.textContent = "상태 확인 실패"
      }
    }

    refresh()
    setInterval(refresh, 1000)
  </script>
</body>
</html>
