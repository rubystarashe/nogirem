<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>채널별 서버 점수</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      background: transparent;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      color: #f7f5f0;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 20px 24px 14px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 18px;
      background: rgba(15, 17, 20, .84);
      backdrop-filter: blur(14px);
    }
    header {
      margin-bottom: 16px;
    }
    .watermark {
      position: absolute;
      top: 14px;
      right: 20px;
      width: 92px;
      height: auto;
      opacity: .08;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 760;
      letter-spacing: -.03em;
    }
    p {
      margin: 0;
      color: rgba(247, 245, 240, .65);
      font-size: 12px;
    }
    #measurement-age {
      font-variant-numeric: tabular-nums;
    }
    #channels {
      display: grid;
      grid-template-columns: repeat(3, 170px);
      justify-content: center;
      gap: 12px;
    }
    .channel-group {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
    }
    article {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      height: 18px;
      padding: 0 9px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    article.ip-boundary {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(247, 245, 240, .42);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .22);
    }
    article:last-child {
      border-bottom: 0;
    }
    article.current {
      background: rgba(247, 245, 240, .16);
      box-shadow: inset 0 0 0 1px rgba(247, 245, 240, .72), inset 4px 0 #f7f5f0;
    }
    article.current span::after {
      content: " 현재";
      color: #f7f5f0;
      font-weight: 800;
    }
    article.best.good {
      background: rgba(131, 217, 160, .14);
      box-shadow: inset 3px 0 #83d9a0;
    }
    article.best.normal {
      background: rgba(241, 209, 123, .14);
      box-shadow: inset 3px 0 #f1d17b;
    }
    article.best.slow {
      background: rgba(239, 159, 99, .15);
      box-shadow: inset 3px 0 #ef9f63;
    }
    article.best.critical {
      background: rgba(240, 142, 129, .15);
      box-shadow: inset 3px 0 #f08e81;
    }
    article span {
      flex: 0 0 auto;
      color: rgba(247, 245, 240, .58);
      font-size: 10px;
    }
    article strong {
      min-width: 0;
      overflow: hidden;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    article.good strong {
      color: #83d9a0;
    }
    article.normal strong {
      color: #f1d17b;
    }
    article.slow strong {
      color: #ef9f63;
    }
    article.critical strong,
    article.failed strong {
      color: #f08e81;
    }
    article.waiting strong {
      color: rgba(247, 245, 240, .56);
      font-size: 10px;
    }
    footer {
      margin-top: 10px;
      color: rgba(247, 245, 240, .48);
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main aria-label="채널별 서버 점수">
    <img class="watermark" src="./logo2-white-transparent.png" alt="" draggable="false">
    <header>
      <h1>채널별 서버 점수</h1>
      <p id="measurement-age">측정 준비 중</p>
    </header>
    <section id="channels" aria-live="polite"></section>
    <footer>채널 점수는 연결 시험 변동값을 기준으로 측정합니다</footer>
  </main>
  <script>
    const channels = document.querySelector("#channels")
    const measurementAge = document.querySelector("#measurement-age")
    const channelGroups = [[1, 15], [16, 29], [30, 38]]
    let measurementSpanMs = null
    let activeConnection = null
    let refreshFailed = false

    function variationGrade(score, sampleCount) {
      if (sampleCount < 3 || score == null) return "waiting"
      if (score <= 50) return "good"
      if (score <= 100) return "normal"
      if (score <= 150) return "slow"
      return "critical"
    }

    function endpointIp(endpoint) {
      return endpoint?.replace(/:\d+$/, "") ?? null
    }

    function updateMeasurementAge() {
      if (refreshFailed) {
        measurementAge.textContent = "상태 확인 실패"
        return
      }
      if (measurementSpanMs == null) {
        measurementAge.textContent = "측정 준비 중"
        return
      }
      const measuredMinutes = Math.floor(measurementSpanMs / 60000)
      measurementAge.textContent = measuredMinutes < 1
        ? "1분 미만 측정한 데이터입니다"
        : `${Math.min(20, measuredMinutes)}분간 측정한 데이터입니다`
    }

    function render(status) {
      const items = status.channels || []
      activeConnection = status.activeConnection || null
      measurementSpanMs = status.measurementSpanMs ?? null
      const scored = items.filter(item => item.sampleCount >= 3 && Number.isFinite(item.variationScore))
      const bestScore = scored.length
        ? Math.min(...scored.map(item => item.variationScore))
        : null
      const createCard = item => {
        const current = activeConnection?.channel === item.channel
        const score = item.variationScore ?? null
        const best = bestScore != null
          && item.sampleCount >= 3
          && score === bestScore
        const card = document.createElement("article")
        const label = document.createElement("span")
        const value = document.createElement("strong")
        label.textContent = `${item.channel}채널`
        const color = variationGrade(score, item.sampleCount)
        card.className = `${color}${current ? " current" : ""}${best ? " best" : ""}`
        card.title = item.endpoint || "접속 정보 없음"
        value.textContent = item.sampleCount < 3
          ? "측정 중"
          : item.variationMs == null
            ? item.endpoint ? item.quality || "확인 중" : "정보 없음"
            : `${score}`
        card.append(label, value)
        return card
      }
      channels.replaceChildren(...channelGroups.map(([start, end]) => {
        const group = document.createElement("section")
        group.className = "channel-group"
        group.setAttribute("aria-label", `${start}채널부터 ${end}채널`)
        const groupItems = items
          .filter(item => item.endpoint && item.channel >= start && item.channel <= end)
          .sort((left, right) => left.channel - right.channel)
        groupItems.forEach((item, index) => {
          const card = createCard(item)
          const nextItem = groupItems[index + 1]
          if (nextItem && endpointIp(item.endpoint) !== endpointIp(nextItem.endpoint)) {
            card.classList.add("ip-boundary")
          }
          group.append(card)
        })
        return group
      }))
      refreshFailed = false
      updateMeasurementAge()
    }

    async function refresh() {
      try {
        render(await window.channelPing.getStatus())
      } catch {
        refreshFailed = true
        updateMeasurementAge()
      }
    }

    refresh()
    setInterval(() => {
      updateMeasurementAge()
      refresh()
    }, 1000)
  </script>
</body>
</html>
