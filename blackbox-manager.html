<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>게임 블랙박스 관리</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: #f3f5f7;
        background: #101214;
        font-family: "Pretendard Variable", Pretendard, "Segoe UI", sans-serif;
      }

      button,
      select {
        font: inherit;
      }

      button:focus,
      select:focus {
        outline: none;
      }

      .titlebar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 52px;
        height: 46px;
        -webkit-app-region: drag;
      }

      .window-close {
        position: fixed;
        z-index: 11;
        top: 10px;
        right: 13px;
        width: 28px;
        height: 28px;
        padding: 4px;
        border: 0;
        color: #969da2;
        background: transparent;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .window-close:hover {
        color: #fff;
      }

      .window-close svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }

      .manager {
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 38px 26px 22px;
      }

      .heading {
        position: relative;
        margin-bottom: 14px;
      }

      .watermark {
        position: absolute;
        top: -29px;
        right: 12px;
        width: 88px;
        opacity: 0.06;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #8f989d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        line-height: 1.35;
      }

      .description {
        margin: 6px 0 0;
        color: #aeb5b9;
        font-size: 11px;
        line-height: 1.5;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .status-card {
        min-height: 78px;
        padding: 12px 13px;
        border: 1px solid #30363a;
        border-radius: 9px;
        background: #191c1e;
      }

      .status-label {
        display: block;
        margin-bottom: 7px;
        color: #8f989d;
        font-size: 9px;
        font-weight: 700;
      }

      .status-value {
        display: block;
        overflow: hidden;
        margin-bottom: 3px;
        font-size: 14px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-detail {
        display: block;
        overflow: hidden;
        color: #8f989d;
        font-size: 10px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-value.ready,
      .status-detail.ready {
        color: #67bd78;
      }

      .status-value.warning,
      .status-detail.warning {
        color: #e39a42;
      }

      .settings {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
        padding: 12px 13px;
        border: 1px solid #30363a;
        border-radius: 9px;
        background: #16191b;
      }

      .settings label {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .settings .quality,
      .settings .codec,
      .settings .fps {
        grid-column: span 2;
      }

      .settings .capacity,
      .settings .clip-duration {
        grid-column: span 3;
      }

      .settings label > span {
        color: #b9c0c4;
        font-size: 9px;
        font-weight: 700;
      }

      .settings select {
        width: 100%;
        height: 29px;
        padding: 0 7px;
        border: 1px solid #41484c;
        border-radius: 6px;
        color: #eef1f2;
        background: #222629;
        font-size: 10px;
        font-weight: 700;
      }

      .settings select:focus {
        border-color: #747e83;
      }

      .settings-summary {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        color: #7f898e;
        font-size: 9px;
      }

      .message {
        min-height: 30px;
        margin: 9px 0 0;
        padding: 8px 10px;
        border-radius: 7px;
        color: #aeb5b9;
        background: #151719;
        font-size: 10px;
        line-height: 1.4;
      }

      .message.error {
        color: #ef847b;
      }

      .actions {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: auto;
      }

      .action-group {
        display: flex;
        gap: 7px;
      }

      .action {
        height: 34px;
        padding: 0 13px;
        border: 1px solid #3a4044;
        border-radius: 7px;
        color: #e6eaec;
        background: #202427;
        cursor: pointer;
      }

      .action:hover:not(:disabled) {
        border-color: #596166;
        background: #2b3034;
      }

      .action.primary {
        min-width: 94px;
        border-color: #f1f3f4;
        color: #141617;
        background: #f1f3f4;
        font-weight: 800;
      }

      .action.primary:hover:not(:disabled) {
        background: #fff;
      }

      .action.active {
        border-color: #5faa70;
        color: #82d594;
        background: rgba(65, 143, 83, 0.12);
      }

      .action.danger {
        border-color: #593b3b;
        color: #d38989;
        background: rgba(128, 52, 52, 0.1);
      }

      .action:disabled {
        opacity: 0.38;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <button class="window-close" aria-label="창 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.3 4 12 10.7 18.7 4 20 5.3 13.3 12l6.7 6.7-1.3 1.3-6.7-6.7L5.3 20 4 18.7l6.7-6.7L4 5.3 5.3 4Z" />
      </svg>
    </button>
    <main class="manager">
      <header class="heading">
        <img class="watermark" src="./logo2-white-transparent.png" alt="" draggable="false" />
        <p class="eyebrow">GAME BLACK BOX</p>
        <h1>게임 블랙박스 관리</h1>
        <p class="description">마비노기 화면과 게임 소리를 순환 녹화하고 원하는 구간을 별도 클립으로 저장합니다.</p>
      </header>
      <section class="status-grid" aria-label="블랙박스 상태">
        <article class="status-card">
          <span class="status-label">녹화 상태</span>
          <strong class="status-value recording-state">확인 중</strong>
          <span class="status-detail recording-detail">녹화 프로세스를 확인하고 있습니다</span>
        </article>
        <article class="status-card">
          <span class="status-label">순환 녹화</span>
          <strong class="status-value usage-value">0.0 / 50 GB</strong>
          <span class="status-detail usage-detail">녹화된 영상 없음</span>
        </article>
        <article class="status-card">
          <span class="status-label">게임 소리</span>
          <strong class="status-value audio-state">대기 중</strong>
          <span class="status-detail audio-detail">마비노기 소리만 녹화합니다</span>
        </article>
      </section>
      <section class="settings" aria-label="블랙박스 설정">
        <label class="quality">
          <span>화질</span>
          <select class="quality-select">
            <option value="auto">자동 권장</option>
            <option value="1080p">최대 1080p</option>
            <option value="1440p">최대 1440p</option>
            <option value="original">원본</option>
          </select>
        </label>
        <label class="codec">
          <span>영상 코덱</span>
          <select class="codec-select">
            <option value="h264">H.264 · 기본 권장</option>
            <option value="hevc">HEVC · 용량 절약</option>
          </select>
        </label>
        <label class="fps">
          <span>프레임</span>
          <select class="fps-select">
            <option value="30">30fps</option>
            <option value="60">60fps</option>
          </select>
        </label>
        <label class="capacity">
          <span>순환 저장 한도</span>
          <select class="capacity-select">
            <option value="20">20 GB</option>
            <option value="50">50 GB</option>
            <option value="100">100 GB</option>
            <option value="200">200 GB</option>
          </select>
        </label>
        <label class="clip-duration">
          <span>빠른 클립 길이</span>
          <select class="clip-select">
            <option value="30">최근 약 30초</option>
            <option value="60">최근 약 60초</option>
            <option value="120">최근 약 120초</option>
          </select>
        </label>
        <div class="settings-summary">
          <span class="quality-summary">자동 판정</span>
          <span>빠른 저장 단축키 Ctrl+Shift+F10</span>
        </div>
      </section>
      <p class="message" role="status"></p>
      <footer class="actions">
        <div class="action-group">
          <button class="action open-editor" type="button">영상 추출</button>
          <button class="action save-clip" type="button">최근 클립 저장</button>
          <button class="action open-folder" type="button">저장 폴더</button>
          <button class="action danger clear-recording" type="button">전체 비우기</button>
        </div>
        <div class="action-group">
          <button class="action save-setting" type="button">설정 저장</button>
          <button class="action primary toggle-recording" type="button" disabled>확인 중</button>
        </div>
      </footer>
    </main>
    <script>
      const closeButton = document.querySelector(".window-close")
      const recordingState = document.querySelector(".recording-state")
      const recordingDetail = document.querySelector(".recording-detail")
      const usageValue = document.querySelector(".usage-value")
      const usageDetail = document.querySelector(".usage-detail")
      const audioState = document.querySelector(".audio-state")
      const audioDetail = document.querySelector(".audio-detail")
      const qualitySelect = document.querySelector(".quality-select")
      const codecSelect = document.querySelector(".codec-select")
      const fpsSelect = document.querySelector(".fps-select")
      const capacitySelect = document.querySelector(".capacity-select")
      const clipSelect = document.querySelector(".clip-select")
      const qualitySummary = document.querySelector(".quality-summary")
      const message = document.querySelector(".message")
      const openEditorButton = document.querySelector(".open-editor")
      const saveClipButton = document.querySelector(".save-clip")
      const openFolderButton = document.querySelector(".open-folder")
      const clearRecordingButton = document.querySelector(".clear-recording")
      const saveSettingButton = document.querySelector(".save-setting")
      const toggleRecordingButton = document.querySelector(".toggle-recording")
      const settingInputs = [
        qualitySelect,
        codecSelect,
        fpsSelect,
        capacitySelect,
        clipSelect,
      ]
      let status = null
      let busy = false
      let settingsInitialized = false
      let settingsDirty = false
      let previousClip = null

      function errorMessage(error) {
        return error?.message?.replace(/^Error invoking remote method '[^']+': Error: /, "")
          ?? String(error)
      }

      function formatDuration(seconds) {
        const totalMinutes = Math.floor(Math.max(0, Number(seconds) || 0) / 60)
        if (totalMinutes < 1) return `${Math.floor(Math.max(0, Number(seconds) || 0))}초`
        if (totalMinutes < 60) return `${totalMinutes}분`
        return `${Math.floor(totalMinutes / 60)}시간 ${totalMinutes % 60}분`
      }

      function qualityLabel(quality) {
        if (quality === "original") return "원본"
        return quality === "1440p" ? "최대 1440p" : "최대 1080p"
      }

      function draftSetting(enabled = status?.enabled) {
        return {
          featureEnabled: Boolean(status?.featureEnabled),
          enabled: Boolean(enabled),
          quality: qualitySelect.value,
          codec: codecSelect.value,
          fps: Number(fpsSelect.value),
          capacityGb: Number(capacitySelect.value),
          clipSeconds: Number(clipSelect.value),
          chunkSeconds: 4,
        }
      }

      function selectedBitrate() {
        const setting = draftSetting()
        const quality = setting.quality === "auto"
          ? status?.resolvedQuality ?? "1440p"
          : setting.quality
        const rates = {
          "1080p": { h264: setting.fps === 60 ? 12 : 7, hevc: setting.fps === 60 ? 8 : 5 },
          "1440p": { h264: setting.fps === 60 ? 24 : 14, hevc: setting.fps === 60 ? 16 : 10 },
          original: { h264: setting.fps === 60 ? 32 : 20, hevc: setting.fps === 60 ? 22 : 14 },
        }
        return rates[quality][setting.codec]
      }

      function renderSettingSummary() {
        const capacity = Number(capacitySelect.value)
        const estimatedHours = capacity / ((selectedBitrate() + 0.192) * 0.45)
        qualitySummary.textContent = `${
          qualitySelect.value === "auto"
            ? `자동 판정 · ${qualityLabel(status?.resolvedQuality)}`
            : qualityLabel(qualitySelect.value)
        } · 예상 보존 약 ${estimatedHours.toFixed(1)}시간`
      }

      function initializeSettings(value) {
        if (settingsInitialized) return
        qualitySelect.value = value.quality
        codecSelect.value = value.codec
        fpsSelect.value = String(value.fps)
        capacitySelect.value = String(value.capacityGb)
        clipSelect.value = String(value.clipSeconds)
        settingsInitialized = true
        settingsDirty = false
      }

      function render(value) {
        const oldClip = previousClip
        status = value
        previousClip = value.latestClip
        initializeSettings(value)
        if (value.recording) {
          recordingState.textContent = "순환 녹화 중"
          recordingState.className = "status-value recording-state ready"
          recordingDetail.textContent = `${value.width || 0}×${value.height || 0} · ${value.fps}fps · ${
            value.codec === "hevc" ? "HEVC" : "H.264"
          }`
        } else if (!value.enabled) {
          recordingState.textContent = "사용 안 함"
          recordingState.className = "status-value recording-state"
          recordingDetail.textContent = "설정을 확인한 뒤 사용할 수 있습니다"
        } else if (value.waitingForGame) {
          recordingState.textContent = "게임 실행 대기"
          recordingState.className = "status-value recording-state warning"
          recordingDetail.textContent = "마비노기 화면을 기다리고 있습니다"
        } else {
          recordingState.textContent = value.running ? "녹화 준비 중" : "실행 확인 필요"
          recordingState.className = `status-value recording-state ${value.running ? "warning" : ""}`
          recordingDetail.textContent = value.reason || "녹화 프로세스를 확인하고 있습니다"
        }

        usageValue.textContent = `${(value.bytesUsed / 1024 ** 3).toFixed(1)} / ${value.capacityGb} GB`
        usageDetail.textContent = value.durationSeconds > 0
          ? `약 ${formatDuration(value.durationSeconds)} 누적`
          : "녹화된 영상 없음"

        if (value.audioRecording) {
          const gain = Number(value.audioGainDb || 0).toFixed(1)
          audioState.textContent = "게임 소리 녹화 중"
          audioState.className = "status-value audio-state ready"
          audioDetail.textContent = `자동 조정 ${value.audioGainDb > 0 ? "+" : ""}${gain}dB`
        } else {
          audioState.textContent = value.recording ? "영상만 녹화 중" : "대기 중"
          audioState.className = `status-value audio-state ${value.audioError ? "warning" : ""}`
          audioDetail.textContent = value.audioError || "마비노기 소리만 녹화합니다"
        }

        toggleRecordingButton.textContent = !value.featureEnabled
          ? "사용 설정 필요"
          : value.enabled ? "사용 중" : "사용하기"
        toggleRecordingButton.classList.toggle("active", value.enabled)
        openEditorButton.disabled = busy || !value.recording
        saveClipButton.disabled = busy || !value.recording || value.clipInProgress
        saveClipButton.textContent = value.clipInProgress ? "저장 중…" : "최근 클립 저장"
        clearRecordingButton.disabled = busy || (value.bytesUsed <= 0 && value.durationSeconds <= 0)
        saveSettingButton.disabled = busy || !settingsDirty
        toggleRecordingButton.disabled = busy || !value.featureEnabled
        renderSettingSummary()

        if (value.latestClip && value.latestClip !== oldClip) {
          message.classList.remove("error")
          message.textContent = "최근 클립 저장이 완료되었습니다"
        } else if (value.reason) {
          message.classList.add("error")
          message.textContent = value.reason
        }
      }

      function setBusy(value, text = "") {
        busy = value
        for (const input of settingInputs) input.disabled = value
        if (text) {
          message.classList.remove("error")
          message.textContent = text
        }
        if (status) render(status)
      }

      async function refreshStatus(silent = false) {
        try {
          render(await window.blackboxManager.getStatus())
        } catch (error) {
          if (!silent) {
            message.classList.add("error")
            message.textContent = errorMessage(error)
          }
        }
      }

      async function runAction(text, action, successText = "") {
        setBusy(true, text)
        try {
          const result = await action()
          if (result && typeof result === "object" && "enabled" in result) render(result)
          if (successText) {
            message.classList.remove("error")
            message.textContent = successText
          }
          return result
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
          return null
        } finally {
          setBusy(false)
          void refreshStatus(true)
        }
      }

      for (const input of settingInputs) {
        input.addEventListener("change", () => {
          settingsDirty = true
          saveSettingButton.disabled = busy
          renderSettingSummary()
        })
      }

      saveSettingButton.addEventListener("click", async () => {
        const result = await runAction(
          "블랙박스 설정을 저장하고 있습니다",
          () => window.blackboxManager.setSetting(draftSetting()),
          "블랙박스 설정을 저장했습니다",
        )
        if (result) settingsDirty = false
      })

      toggleRecordingButton.addEventListener("click", async () => {
        const enabling = !status?.enabled
        const result = await runAction(
          enabling ? "블랙박스 녹화를 시작하고 있습니다" : "블랙박스 녹화를 종료하고 있습니다",
          () => window.blackboxManager.setSetting(draftSetting(enabling)),
          enabling ? "블랙박스를 사용합니다" : "블랙박스를 사용하지 않습니다",
        )
        if (result) settingsDirty = false
      })

      saveClipButton.addEventListener("click", () => {
        void runAction(
          `최근 약 ${status.clipSeconds}초 클립 저장을 요청하고 있습니다`,
          () => window.blackboxManager.saveClip(),
          "최근 클립을 저장하고 있습니다",
        )
      })

      clearRecordingButton.addEventListener("click", async () => {
        const result = await runAction(
          "순환 녹화 비우기를 확인하고 있습니다",
          () => window.blackboxManager.clearRecording(),
        )
        if (result && !result.canceled) {
          message.classList.remove("error")
          message.textContent = "저장된 클립을 제외한 순환 녹화를 모두 비웠습니다"
        } else if (result?.canceled) {
          message.textContent = ""
        }
      })

      openEditorButton.addEventListener("click", () => {
        void runAction(
          "블랙박스 영상 추출 화면을 열고 있습니다",
          () => window.blackboxManager.openEditor(),
        )
      })

      openFolderButton.addEventListener("click", () => {
        void runAction(
          "블랙박스 저장 폴더를 열고 있습니다",
          () => window.blackboxManager.openFolder(),
        )
      })

      closeButton.addEventListener("click", () => {
        closeButton.disabled = true
        void window.blackboxManager.requestClose()
      })

      void refreshStatus()
      window.setInterval(() => {
        if (!busy) void refreshStatus(true)
      }, 1000)
    </script>
  </body>
</html>
