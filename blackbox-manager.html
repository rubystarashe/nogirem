<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>게임 블랙박스 관리</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: #f3f5f7;
        background: #101214;
        font-family: "Pretendard Variable", Pretendard, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button:focus,
      input:focus,
      select:focus {
        outline: none;
      }

      .titlebar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 52px;
        height: 46px;
        -webkit-app-region: drag;
      }

      .window-close {
        position: fixed;
        z-index: 11;
        top: 10px;
        right: 13px;
        width: 28px;
        height: 28px;
        padding: 4px;
        border: 0;
        color: #969da2;
        background: transparent;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .window-close:hover {
        color: #fff;
      }

      .window-close svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }

      .manager {
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 38px 26px 22px;
      }

      .heading {
        position: relative;
        margin-bottom: 14px;
      }

      .heading-line {
        display: flex;
        min-height: 58px;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }

      .heading-copy {
        min-width: 0;
      }

      .heading-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .recording-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #899297;
        font-size: 10px;
        font-weight: 750;
        white-space: nowrap;
      }

      .recording-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #697176;
      }

      .recording-badge.ready {
        color: #72cf85;
      }

      .recording-badge.ready .recording-dot {
        background: #5dcc73;
        box-shadow: 0 0 0 3px rgba(93, 204, 115, 0.1);
      }

      .recording-badge.warning {
        color: #e39a42;
      }

      .recording-badge.warning .recording-dot {
        background: #e39a42;
      }

      .watermark {
        position: absolute;
        top: -29px;
        right: 55px;
        width: 88px;
        opacity: 0.06;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #8f989d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        line-height: 1.35;
      }

      .description {
        margin: 6px 0 0;
        color: #aeb5b9;
        font-size: 11px;
        line-height: 1.5;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .status-card {
        min-height: 78px;
        padding: 12px 13px;
        border: 1px solid #30363a;
        border-radius: 9px;
        background: #191c1e;
      }

      .status-label {
        display: block;
        margin-bottom: 7px;
        color: #8f989d;
        font-size: 9px;
        font-weight: 700;
      }

      .status-value {
        display: block;
        overflow: hidden;
        margin-bottom: 3px;
        font-size: 14px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-detail {
        display: block;
        overflow: hidden;
        color: #8f989d;
        font-size: 10px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-value.ready,
      .status-detail.ready {
        color: #67bd78;
      }

      .status-value.warning,
      .status-detail.warning {
        color: #e39a42;
      }

      .settings {
        display: block;
        width: min(480px, 100%);
        margin-top: 10px;
      }

      .settings label {
        display: grid;
        grid-template-columns: 110px 280px;
        min-width: 0;
        align-items: center;
        justify-content: start;
        gap: 18px;
        padding: 13px 4px;
        border-bottom: 1px solid #292f32;
      }

      .settings label > span {
        color: #b9c0c4;
        font-size: 11px;
        font-weight: 700;
      }

      .settings .cleanup-recording {
        width: 280px;
      }

      .settings select,
      .settings input {
        width: 280px;
        height: 32px;
        padding: 0 9px;
        border: 1px solid #41484c;
        border-radius: 6px;
        color: #eef1f2;
        background: #222629;
        font-size: 10px;
        font-weight: 700;
      }

      .settings input {
        cursor: pointer;
      }

      .settings select:focus,
      .settings input:focus {
        border-color: #747e83;
      }

      .settings input.capturing {
        border-color: #d5b657;
        color: #f0d67e;
      }

      .settings .duration-inputs {
        display: flex;
        width: 280px;
        align-items: center;
        gap: 7px;
      }

      .settings .duration-inputs input {
        width: 58px;
      }

      .settings .duration-inputs span {
        color: #9da5a9;
        font-size: 10px;
      }

      .storage-path-control {
        display: grid;
        width: 280px;
        grid-template-columns: minmax(0, 1fr) 58px;
        gap: 7px;
      }

      .settings .storage-path-input {
        width: 100%;
        min-width: 0;
        cursor: default;
        text-overflow: ellipsis;
      }

      .storage-path-button {
        height: 32px;
        padding: 0;
      }

      .settings-summary {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 13px 4px;
        border-bottom: 1px solid #292f32;
        color: #7f898e;
        font-size: 10px;
      }

      .message {
        min-height: 30px;
        margin: 9px 0 0;
        padding: 8px 10px;
        border-radius: 7px;
        color: #aeb5b9;
        background: #151719;
        font-size: 10px;
        line-height: 1.4;
      }

      .message.error {
        color: #ef847b;
      }

      .message:empty {
        display: none;
      }

      .page-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 10px;
      }

      .action-group {
        display: flex;
        gap: 7px;
      }

      .action {
        height: 34px;
        padding: 0 13px;
        border: 1px solid #3a4044;
        border-radius: 7px;
        color: #e6eaec;
        background: #202427;
        cursor: pointer;
      }

      .action:hover:not(:disabled) {
        border-color: #596166;
        background: #2b3034;
      }

      .action.primary {
        min-width: 94px;
        border-color: #f1f3f4;
        color: #141617;
        background: #f1f3f4;
        font-weight: 800;
      }

      .action.primary:hover:not(:disabled) {
        background: #fff;
      }

      .action.active {
        border-color: #5faa70;
        color: #82d594;
        background: rgba(65, 143, 83, 0.12);
      }

      .action.danger {
        border-color: #593b3b;
        color: #d38989;
        background: rgba(128, 52, 52, 0.1);
      }

      .action:disabled {
        opacity: 0.38;
        cursor: default;
      }

      .clip-save-modal,
      .clip-delete-modal {
        position: fixed;
        z-index: 30;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 8, 9, 0.72);
        backdrop-filter: blur(2px);
      }

      .clip-save-modal[hidden],
      .clip-delete-modal[hidden] {
        display: none;
      }

      .clip-save-dialog,
      .clip-delete-dialog {
        display: grid;
        width: min(380px, calc(100vw - 40px));
        gap: 13px;
        padding: 22px;
        border: 1px solid #3a4144;
        border-radius: 9px;
        background: #171a1c;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
      }

      .clip-save-dialog h2,
      .clip-delete-dialog h2 {
        margin: 0;
        color: #edf0f1;
        font-size: 17px;
      }

      .clip-save-dialog label {
        display: grid;
        gap: 7px;
        color: #b7bec1;
        font-size: 11px;
      }

      .clip-delete-description {
        margin: 0;
        color: #b7bec1;
        font-size: 11px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .clip-save-name {
        height: 34px;
        padding: 0 10px;
        border: 1px solid #41484c;
        border-radius: 6px;
        color: #eef1f2;
        background: #222629;
      }

      .clip-save-actions {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
      }

      .page-tabs {
        display: flex;
        gap: 4px;
        margin-top: 10px;
        border-bottom: 1px solid #30363a;
      }

      .page-tab {
        position: relative;
        padding: 8px 13px 10px;
        border: 0;
        color: #818a8f;
        background: transparent;
        cursor: pointer;
        font-size: 11px;
        font-weight: 750;
      }

      .page-tab.active {
        color: #f3f5f7;
      }

      .page-tab.active::after {
        position: absolute;
        right: 11px;
        bottom: -1px;
        left: 11px;
        height: 2px;
        background: #ffd400;
        content: "";
      }

      .page {
        display: none;
        min-height: 0;
        flex: 1;
        margin-top: 10px;
      }

      .page.active {
        display: block;
      }

      .extract-page {
        overflow: hidden;
        border: 1px solid #30363a;
        border-radius: 9px;
        background: #0d0f10;
      }

      .extract-page.active {
        display: flex;
      }

      .extract-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #0d0f10;
      }

      .settings-page {
        overflow: hidden;
      }

      .settings-page .settings {
        margin-top: 0;
      }

      .clips-page.active {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 10px;
      }

      .settings-page .page-actions {
        width: min(480px, 100%);
        justify-content: flex-end;
      }

      .settings-page .message {
        min-width: 0;
        min-height: 0;
        margin: 0 auto 0 4px;
        padding: 0;
        overflow: hidden;
        background: transparent;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .clip-browser > .message {
        margin: 0;
        border-radius: 0;
        border-top: 1px solid #30363a;
      }

      .clip-preview,
      .clip-browser {
        min-height: 0;
        border: 1px solid #30363a;
        border-radius: 9px;
        background: #16191b;
      }

      .clip-preview {
        display: grid;
        overflow: hidden;
        place-items: center;
        background: #080a0b;
      }

      .clip-preview.media-ready {
        height: auto;
        max-height: 100%;
        align-self: center;
        aspect-ratio: var(--media-aspect);
      }

      .clip-preview > * {
        grid-area: 1 / 1;
      }

      .clip-preview video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #050607;
      }

      .clip-preview video[hidden],
      .clip-empty[hidden] {
        display: none;
      }

      .clip-empty {
        padding: 24px;
        color: #818a8f;
        font-size: 11px;
        line-height: 1.6;
        text-align: center;
      }

      .clip-browser {
        display: flex;
        width: 290px;
        min-width: 290px;
        max-width: 290px;
        overflow: hidden;
        flex-direction: column;
      }

      .clip-browser-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        border-bottom: 1px solid #30363a;
      }

      .clip-browser-title {
        display: grid;
        min-width: 0;
        gap: 2px;
      }

      .clip-browser-header strong {
        font-size: 11px;
      }

      .clip-save-header {
        height: 27px;
        flex: none;
        padding: 0 8px;
        font-size: 9px;
      }

      .clip-count {
        color: #818a8f;
        font-size: 9px;
      }

      .clip-list {
        overflow-y: auto;
        padding: 6px;
      }

      .clip-date {
        padding: 8px 7px 5px;
        color: #7f898e;
        font-size: 9px;
        font-weight: 750;
      }

      .clip-item {
        display: grid;
        width: 100%;
        grid-template-columns: minmax(0, 1fr) 36px;
        gap: 4px 8px;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 7px;
        color: #dfe3e5;
        background: transparent;
        text-align: left;
      }

      .clip-item:hover,
      .clip-item.active {
        border-color: #3b4246;
        background: #202427;
      }

      .clip-item.active {
        border-color: #667076;
      }

      .clip-name {
        overflow: hidden;
        padding: 0;
        border: 0;
        color: #dfe3e5;
        background: transparent;
        cursor: text;
        font-size: 10px;
        font-weight: 700;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .clip-name:hover {
        text-decoration: underline;
      }

      .clip-name-input {
        min-width: 0;
        height: 24px;
        padding: 0 6px;
        border: 1px solid #667076;
        border-radius: 5px;
        color: #f3f5f7;
        background: #101214;
        font-size: 10px;
      }

      .clip-meta {
        display: flex;
        gap: 8px;
        cursor: pointer;
      }

      .clip-delete {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: stretch;
        padding: 0;
        border: 0;
        border-radius: 5px;
        color: #899297;
        background: transparent;
        cursor: pointer;
        font-size: 9px;
      }

      .clip-delete:hover {
        color: #f0a19a;
        background: rgba(164, 67, 59, 0.18);
      }

      .clip-time,
      .clip-size {
        color: #818a8f;
        font-size: 9px;
      }

      .settings-action {
        display: none;
      }

      body[data-page="settings"] .settings-action {
        display: inline-flex;
        align-items: center;
      }

      .manager {
        padding-bottom: 16px;
      }

      .heading {
        margin-bottom: 10px;
      }

      .status-card {
        min-height: 70px;
        padding: 10px 12px;
      }

      .actions {
        margin-top: 10px;
      }

      .message:empty {
        min-height: 0;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body data-page="extract">
    <div class="titlebar"></div>
    <button class="window-close" aria-label="창 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.3 4 12 10.7 18.7 4 20 5.3 13.3 12l6.7 6.7-1.3 1.3-6.7-6.7L5.3 20 4 18.7l6.7-6.7L4 5.3 5.3 4Z" />
      </svg>
    </button>
    <main class="manager">
      <header class="heading">
        <img class="watermark" src="./logo2-white-transparent.png" alt="" draggable="false" />
        <div class="heading-line">
          <div class="heading-copy">
            <p class="eyebrow">GAME BLACK BOX</p>
            <div class="heading-title">
              <h1>게임 블랙박스 관리</h1>
              <span class="recording-badge">
                <i class="recording-dot"></i>
                <strong class="recording-state">확인 중</strong>
              </span>
            </div>
            <p class="description">녹화된 구간을 확인하고 원하는 부분을 별도 클립으로 저장합니다.</p>
          </div>
        </div>
      </header>
      <nav class="page-tabs" aria-label="블랙박스 관리 메뉴">
        <button class="page-tab active" type="button" data-page="extract">영상 추출</button>
        <button class="page-tab" type="button" data-page="clips">저장된 클립</button>
        <button class="page-tab" type="button" data-page="settings">녹화 설정</button>
      </nav>
      <section class="page extract-page active" data-page-panel="extract">
        <iframe
          class="extract-frame"
          src="./blackbox-editor.html?embedded=1"
          title="블랙박스 영상 추출"
          allowfullscreen
        ></iframe>
      </section>
      <section class="page clips-page" data-page-panel="clips">
        <div class="clip-browser">
          <header class="clip-browser-header">
            <div class="clip-browser-title">
              <strong>저장된 클립</strong>
              <span class="clip-count">불러오는 중</span>
            </div>
            <button class="action save-clip clip-save-header" type="button">클립 저장</button>
          </header>
          <div class="clip-list"></div>
          <p class="message clip-message" role="status"></p>
        </div>
        <div class="clip-preview">
          <video class="saved-clip-video" controls preload="metadata" hidden></video>
          <p class="clip-empty">저장된 클립을 선택하면 이곳에서 바로 확인할 수 있습니다</p>
        </div>
      </section>
      <section class="page settings-page" data-page-panel="settings">
      <section class="settings" aria-label="블랙박스 설정">
        <label class="quality">
          <span>화질</span>
          <select class="quality-select">
            <option value="auto">자동 권장</option>
            <option value="1080p">최대 1080p</option>
            <option value="1440p">최대 1440p</option>
            <option value="original">원본</option>
          </select>
        </label>
        <label class="codec">
          <span>영상 코덱</span>
          <select class="codec-select">
            <option value="h264">H.264 · 기본 권장</option>
            <option value="hevc">HEVC · 용량 절약</option>
          </select>
        </label>
        <label class="fps">
          <span>프레임</span>
          <select class="fps-select">
            <option value="30">30fps</option>
            <option value="60">60fps</option>
          </select>
        </label>
        <label class="storage-drive">
          <span>청크 저장 드라이브</span>
          <select class="storage-drive-select" aria-label="녹화 청크 저장 드라이브"></select>
        </label>
        <label class="storage-cleanup">
          <span>청크 정리</span>
          <button class="action cleanup-recording" type="button">모든 드라이브 청크 정리</button>
        </label>
        <label class="storage-path">
          <span>녹화 저장 위치</span>
          <div class="storage-path-control">
            <input class="storage-path-input" type="text" readonly aria-label="저장된 클립 위치" />
            <button class="action storage-path-button" type="button">변경</button>
          </div>
        </label>
        <label class="max-duration">
          <span>최대 녹화 길이</span>
          <div class="duration-inputs">
            <input class="max-duration-hours" type="number" min="0" step="1" value="1" aria-label="최대 녹화 길이 시간" />
            <span>시간</span>
            <input class="max-duration-minutes" type="number" min="0" step="1" value="0" aria-label="최대 녹화 길이 분" />
            <span>분</span>
            <input class="max-duration-seconds" type="number" min="0" step="1" value="0" aria-label="최대 녹화 길이 초" />
            <span>초</span>
          </div>
        </label>
        <label class="capacity">
          <span>녹화 용량 한도</span>
          <select class="capacity-select">
            <option value="20">20 GB</option>
            <option value="50">50 GB</option>
            <option value="100">100 GB</option>
            <option value="200">200 GB</option>
          </select>
        </label>
        <label class="clip-duration">
          <span>빠른 클립 길이</span>
          <select class="clip-select">
            <option value="30">최근 약 30초</option>
            <option value="60">최근 약 60초</option>
            <option value="120">최근 약 120초</option>
          </select>
        </label>
        <label class="clip-shortcut">
          <span>빠른 저장 단축키</span>
          <input
            class="shortcut-input"
            type="text"
            value="Ctrl + Shift + F10"
            readonly
            aria-label="빠른 클립 저장 단축키"
          />
        </label>
        <div class="settings-summary">
          <span class="quality-summary">자동 판정</span>
          <span>단축키 입력란에서 원하는 키를 누르세요. Esc는 사용 안 함으로 설정합니다</span>
        </div>
      </section>
        <div class="page-actions">
          <p class="message settings-message" role="status"></p>
          <button class="action save-setting settings-action" type="button">설정 저장</button>
        </div>
      </section>
    </main>
    <div class="clip-save-modal" hidden>
      <form class="clip-save-dialog">
        <h2>최근 클립 저장</h2>
        <label>
          <span>클립 이름</span>
          <input class="clip-save-name" type="text" maxlength="120" />
        </label>
        <div class="clip-save-actions">
          <button class="action clip-save-cancel" type="button">취소</button>
          <button class="action primary clip-save-confirm" type="submit">저장</button>
        </div>
      </form>
    </div>
    <div class="clip-delete-modal" hidden>
      <form class="clip-delete-dialog">
        <h2>저장된 클립 삭제</h2>
        <p class="clip-delete-description"></p>
        <div class="clip-save-actions">
          <button class="action clip-delete-cancel" type="button">취소</button>
          <button class="action danger clip-delete-confirm" type="submit">삭제</button>
        </div>
      </form>
    </div>
    <script>
      const closeButton = document.querySelector(".window-close")
      const recordingState = document.querySelector(".recording-state")
      const recordingBadge = document.querySelector(".recording-badge")
      const qualitySelect = document.querySelector(".quality-select")
      const codecSelect = document.querySelector(".codec-select")
      const fpsSelect = document.querySelector(".fps-select")
      const storageDriveSelect = document.querySelector(".storage-drive-select")
      const cleanupRecordingButton = document.querySelector(".cleanup-recording")
      const storagePathInput = document.querySelector(".storage-path-input")
      const storagePathButton = document.querySelector(".storage-path-button")
      const capacitySelect = document.querySelector(".capacity-select")
      const maxDurationHoursInput = document.querySelector(".max-duration-hours")
      const maxDurationMinutesInput = document.querySelector(".max-duration-minutes")
      const maxDurationSecondsInput = document.querySelector(".max-duration-seconds")
      const clipSelect = document.querySelector(".clip-select")
      const shortcutInput = document.querySelector(".shortcut-input")
      const qualitySummary = document.querySelector(".quality-summary")
      const message = document.querySelector(".settings-message")
      const clipMessage = document.querySelector(".clip-message")
      const saveClipButton = document.querySelector(".save-clip")
      const saveSettingButton = document.querySelector(".save-setting")
      const pageTabs = [...document.querySelectorAll(".page-tab")]
      const pagePanels = [...document.querySelectorAll("[data-page-panel]")]
      const extractFrame = document.querySelector(".extract-frame")
      const clipList = document.querySelector(".clip-list")
      const clipCount = document.querySelector(".clip-count")
      const clipVideo = document.querySelector(".saved-clip-video")
      const clipEmpty = document.querySelector(".clip-empty")
      const clipSaveModal = document.querySelector(".clip-save-modal")
      const clipSaveDialog = document.querySelector(".clip-save-dialog")
      const clipSaveNameInput = document.querySelector(".clip-save-name")
      const clipSaveCancelButton = document.querySelector(".clip-save-cancel")
      const clipDeleteModal = document.querySelector(".clip-delete-modal")
      const clipDeleteDialog = document.querySelector(".clip-delete-dialog")
      const clipDeleteDescription = document.querySelector(".clip-delete-description")
      const clipDeleteCancelButton = document.querySelector(".clip-delete-cancel")
      const settingInputs = [
        qualitySelect,
        codecSelect,
        fpsSelect,
        storageDriveSelect,
        maxDurationHoursInput,
        maxDurationMinutesInput,
        maxDurationSecondsInput,
        capacitySelect,
        clipSelect,
        shortcutInput,
      ]
      let status = null
      let busy = false
      let settingsInitialized = false
      let settingsDirty = false
      let previousClip = null
      let selectedClipName = ""
      let availableClips = []
      let pendingDeleteClip = null

      function errorMessage(error) {
        return error?.message?.replace(/^Error invoking remote method '[^']+': Error: /, "")
          ?? String(error)
      }

      function nextClipPlaceholder() {
        let highest = 0
        for (const clip of availableClips) {
          const match = /^(\d+)번째 클립\.mp4$/i.exec(clip.name)
          if (match) highest = Math.max(highest, Number(match[1]))
        }
        return `${highest + 1}번째 클립`
      }

      async function openClipSaveModal() {
        if (!status) await refreshStatus(true)
        await refreshClips()
        const placeholder = nextClipPlaceholder()
        clipSaveNameInput.value = ""
        clipSaveNameInput.placeholder = placeholder
        clipSaveModal.dataset.fallbackName = placeholder
        clipSaveModal.hidden = false
        clipSaveNameInput.focus()
      }

      function closeClipSaveModal() {
        if (busy) return
        clipSaveModal.hidden = true
      }

      function openClipDeleteModal(clip) {
        pendingDeleteClip = clip
        clipDeleteDescription.textContent = `${clip.name} 파일을 삭제할까요?`
        clipDeleteModal.hidden = false
        clipDeleteCancelButton.focus()
      }

      function closeClipDeleteModal() {
        if (busy) return
        pendingDeleteClip = null
        clipDeleteModal.hidden = true
      }

      function formatDuration(seconds) {
        const totalMinutes = Math.floor(Math.max(0, Number(seconds) || 0) / 60)
        if (totalMinutes < 1) return `${Math.floor(Math.max(0, Number(seconds) || 0))}초`
        if (totalMinutes < 60) return `${totalMinutes}분`
        return `${Math.floor(totalMinutes / 60)}시간 ${totalMinutes % 60}분`
      }

      function qualityLabel(quality) {
        if (quality === "original") return "원본"
        return quality === "1440p" ? "최대 1440p" : "최대 1080p"
      }

      function shortcutFromKeyboardEvent(event) {
        const modifiers = []
        if (event.ctrlKey) modifiers.push("CommandOrControl")
        if (event.altKey) modifiers.push("Alt")
        if (event.shiftKey) modifiers.push("Shift")
        if (event.metaKey) modifiers.push("Super")
        let key = ""
        if (/^Key[A-Z]$/.test(event.code)) key = event.code.slice(3)
        else if (/^Digit[0-9]$/.test(event.code)) key = event.code.slice(5)
        else if (/^F(?:[1-9]|1\d|2[0-4])$/.test(event.code)) key = event.code
        else {
          key = {
            Space: "Space",
            ArrowUp: "Up",
            ArrowDown: "Down",
            ArrowLeft: "Left",
            ArrowRight: "Right",
            Insert: "Insert",
            Delete: "Delete",
            Home: "Home",
            End: "End",
            PageUp: "PageUp",
            PageDown: "PageDown",
            Pause: "Pause",
            PrintScreen: "PrintScreen",
            ScrollLock: "Scrolllock",
            NumLock: "Numlock",
            CapsLock: "Capslock",
            NumpadAdd: "numadd",
            NumpadSubtract: "numsub",
            NumpadMultiply: "nummult",
            NumpadDivide: "numdiv",
            NumpadDecimal: "numdec",
          }[event.code] ?? ""
        }
        const standaloneKeys = [
          "Pause",
          "PrintScreen",
          "Scrolllock",
          "Numlock",
          "Capslock",
        ]
        if (key === "Pause") return "Pause"
        if (!key || (!modifiers.length && !standaloneKeys.includes(key))) return ""
        return [...modifiers, key].join("+")
      }

      function shortcutLabel(accelerator) {
        if (!accelerator) return "사용 안 함"
        return accelerator
          .replace("CommandOrControl", "Ctrl")
          .replace("Control", "Ctrl")
          .replaceAll("+", " + ")
      }

      function disableShortcut() {
        shortcutInput.dataset.accelerator = ""
        shortcutInput.value = "사용 안 함"
        shortcutInput.classList.remove("capturing")
        settingsDirty = true
        saveSettingButton.disabled = busy
        message.classList.remove("error")
        message.textContent = "단축키를 사용하지 않으려면 설정 저장을 눌러 주세요"
      }

      function setMaximumDurationInputs(totalSeconds) {
        const normalized = Math.max(
          60,
          Math.min(7 * 24 * 60 * 60, Math.round(Number(totalSeconds) || 3600)),
        )
        maxDurationHoursInput.value = String(Math.floor(normalized / 3600))
        maxDurationMinutesInput.value = String(Math.floor(normalized % 3600 / 60))
        maxDurationSecondsInput.value = String(normalized % 60)
        return normalized
      }

      function normalizeMaximumDurationInputs() {
        const hours = Math.max(
          0,
          Math.round(Number(maxDurationHoursInput.value) || 0),
        )
        const minutes = Math.max(
          0,
          Math.round(Number(maxDurationMinutesInput.value) || 0),
        )
        const seconds = Math.max(
          0,
          Math.round(Number(maxDurationSecondsInput.value) || 0),
        )
        return setMaximumDurationInputs(hours * 3600 + minutes * 60 + seconds)
      }

      function draftSetting(enabled = status?.enabled) {
        return {
          featureEnabled: Boolean(status?.featureEnabled),
          enabled: Boolean(enabled),
          quality: qualitySelect.value,
          codec: codecSelect.value,
          fps: Number(fpsSelect.value),
          maxDurationSeconds: normalizeMaximumDurationInputs(),
          ringStorageDrive: storageDriveSelect.value,
          clipStoragePath: storagePathInput.dataset.path ?? "",
          capacityGb: Number(capacitySelect.value),
          clipSeconds: Number(clipSelect.value),
          chunkSeconds: 10,
          shortcut: shortcutInput.dataset.accelerator,
        }
      }

      function selectedBitrate() {
        const quality = qualitySelect.value === "auto"
          ? status?.resolvedQuality ?? "1440p"
          : qualitySelect.value
        const rates = {
          "1080p": { h264: Number(fpsSelect.value) === 60 ? 12 : 7, hevc: Number(fpsSelect.value) === 60 ? 8 : 5 },
          "1440p": { h264: Number(fpsSelect.value) === 60 ? 24 : 14, hevc: Number(fpsSelect.value) === 60 ? 16 : 10 },
          original: { h264: Number(fpsSelect.value) === 60 ? 32 : 20, hevc: Number(fpsSelect.value) === 60 ? 22 : 14 },
        }
        return rates[quality][codecSelect.value]
      }

      function renderSettingSummary() {
        const capacity = Number(capacitySelect.value)
        const estimatedHours = capacity / ((selectedBitrate() + 0.192) * 0.45)
        qualitySummary.textContent = `${
          qualitySelect.value === "auto"
            ? `자동 판정 · ${qualityLabel(status?.resolvedQuality)}`
            : qualityLabel(qualitySelect.value)
        } · 예상 보존 약 ${estimatedHours.toFixed(1)}시간`
      }

      function initializeSettings(value) {
        if (settingsInitialized) return
        qualitySelect.value = value.quality
        codecSelect.value = value.codec
        fpsSelect.value = String(value.fps)
        storageDriveSelect.replaceChildren()
        const drives = Array.isArray(value.storageDrives) ? value.storageDrives : []
        for (const drive of drives) {
          const option = document.createElement("option")
          option.value = drive.id
          const freeGigabytes = Number(drive.freeBytes || 0) / 1024 ** 3
          option.textContent = freeGigabytes > 0
            ? `${drive.id} · ${freeGigabytes.toFixed(1)} GB 여유`
            : drive.id
          storageDriveSelect.append(option)
        }
        if (![...storageDriveSelect.options].some(option => option.value === value.ringStorageDrive)) {
          const option = document.createElement("option")
          option.value = value.ringStorageDrive
          option.textContent = value.ringStorageDrive
          storageDriveSelect.append(option)
        }
        storageDriveSelect.value = value.ringStorageDrive
        storagePathInput.dataset.path = value.clipStoragePath ?? ""
        storagePathInput.value = value.clipStoragePath ?? ""
        storagePathInput.title = value.clipStoragePath ?? ""
        setMaximumDurationInputs(value.maxDurationSeconds)
        capacitySelect.value = String(value.capacityGb)
        clipSelect.value = String(value.clipSeconds)
        shortcutInput.dataset.accelerator = value.shortcutAccelerator ?? ""
        shortcutInput.value = value.shortcut || "사용 안 함"
        settingsInitialized = true
        settingsDirty = false
      }

      function render(value) {
        const oldClip = previousClip
        status = value
        previousClip = value.latestClip
        initializeSettings(value)
        if (value.recording) {
          recordingState.textContent = "녹화 중"
          recordingBadge.className = "recording-badge ready"
        } else if (!value.enabled) {
          recordingState.textContent = "사용 안 함"
          recordingBadge.className = "recording-badge"
        } else if (value.waitingForGame) {
          recordingState.textContent = "게임 실행 대기"
          recordingBadge.className = "recording-badge warning"
        } else {
          recordingState.textContent = value.running ? "녹화 준비 중" : "확인 필요"
          recordingBadge.className = `recording-badge ${value.running ? "warning" : ""}`
        }

        extractFrame.contentWindow.postMessage({
          source: "blackbox-manager-status",
          value: {
            running: value.running,
            recording: value.recording,
            bytesUsed: value.bytesUsed,
            capacityGb: value.capacityGb,
            durationSeconds: value.durationSeconds,
          },
        }, "*")

        saveClipButton.disabled = busy || !value.recording || value.clipInProgress
        saveClipButton.textContent = value.clipInProgress ? "저장 중…" : "클립 저장"
        saveSettingButton.disabled = busy || !settingsDirty
        renderSettingSummary()

        if (value.latestClip && value.latestClip !== oldClip) {
          clipMessage.classList.remove("error")
          clipMessage.textContent = "최근 클립 저장이 완료되었습니다"
        } else if (value.reason) {
          message.classList.add("error")
          message.textContent = value.reason
        }
      }

      function setBusy(value, text = "", feedback = message) {
        busy = value
        for (const input of settingInputs) input.disabled = value
        storagePathButton.disabled = value
        cleanupRecordingButton.disabled = value
        if (text) {
          feedback.classList.remove("error")
          feedback.textContent = text
        }
        if (status) render(status)
      }

      async function refreshStatus(silent = false) {
        try {
          render(await window.blackboxManager.getStatus())
        } catch (error) {
          if (!silent) {
            message.classList.add("error")
            message.textContent = errorMessage(error)
          }
        }
      }

      async function runAction(text, action, successText = "", feedback = message) {
        setBusy(true, text, feedback)
        try {
          const result = await action()
          if (result && typeof result === "object" && "enabled" in result) render(result)
          if (successText) {
            feedback.classList.remove("error")
            feedback.textContent = successText
          }
          return result
        } catch (error) {
          feedback.classList.add("error")
          feedback.textContent = errorMessage(error)
          return null
        } finally {
          setBusy(false, "", feedback)
          void refreshStatus(true)
        }
      }

      function formatFileSize(bytes) {
        const megabytes = Number(bytes || 0) / 1024 ** 2
        return megabytes >= 1024
          ? `${(megabytes / 1024).toFixed(1)} GB`
          : `${megabytes.toFixed(1)} MB`
      }

      function fitSavedClipMedia() {
        if (
          document.body.dataset.page !== "clips"
          || !clipVideo.videoWidth
          || !clipVideo.videoHeight
        ) return
        const preview = clipVideo.closest(".clip-preview")
        preview.classList.remove("media-ready")
        const viewportWidth = preview.clientWidth
        const viewportHeight = preview.clientHeight
        preview.classList.add("media-ready")
        preview.style.setProperty(
          "--media-aspect",
          `${clipVideo.videoWidth} / ${clipVideo.videoHeight}`,
        )
        void window.blackboxManager.fitMedia({
          page: "clips",
          mediaWidth: clipVideo.videoWidth,
          mediaHeight: clipVideo.videoHeight,
          viewportWidth,
          viewportHeight,
        })
      }

      function releaseClipVideo() {
        clipVideo.pause()
        clipVideo.removeAttribute("src")
        clipVideo.load()
        clipVideo.hidden = true
        clipEmpty.hidden = false
      }

      function selectClip(clip, item) {
        selectedClipName = clip.name
        for (const candidate of clipList.querySelectorAll(".clip-item")) {
          candidate.classList.toggle("active", candidate === item)
        }
        clipVideo.src = clip.videoUrl
        clipVideo.hidden = false
        clipEmpty.hidden = true
        clipVideo.load()
      }

      function beginClipRename(clip, item, nameButton) {
        selectClip(clip, item)
        const input = document.createElement("input")
        input.className = "clip-name-input"
        input.type = "text"
        input.maxLength = 120
        input.value = clip.name.replace(/\.mp4$/i, "")
        nameButton.replaceWith(input)
        input.focus()
        input.select()
        let finished = false
        const finish = async save => {
          if (finished) return
          finished = true
          if (!save || input.value.trim() === clip.name.replace(/\.mp4$/i, "")) {
            renderClips(availableClips)
            return
          }
          try {
            const result = await window.blackboxManager.renameClip(clip.name, input.value)
            selectedClipName = result.name
            await refreshClips()
          } catch (error) {
            clipMessage.classList.add("error")
            clipMessage.textContent = errorMessage(error)
            renderClips(availableClips)
          }
        }
        input.addEventListener("click", event => event.stopPropagation())
        input.addEventListener("blur", () => void finish(true))
        input.addEventListener("keydown", event => {
          event.stopPropagation()
          if (event.key === "Enter") {
            event.preventDefault()
            void finish(true)
          } else if (event.key === "Escape") {
            event.preventDefault()
            void finish(false)
          }
        })
      }

      async function removeClip(clip) {
        const scrollTop = clipList.scrollTop
        const wasSelected = selectedClipName === clip.name
        if (wasSelected) releaseClipVideo()
        try {
          await window.blackboxManager.deleteClip(clip.name)
          if (wasSelected) selectedClipName = ""
          await refreshClips()
          clipList.scrollTop = scrollTop
          clipMessage.classList.remove("error")
          clipMessage.textContent = ""
        } catch (error) {
          clipMessage.classList.add("error")
          clipMessage.textContent = errorMessage(error)
          await refreshClips()
          clipList.scrollTop = scrollTop
        }
      }

      function renderClips(clips) {
        availableClips = clips
        clipList.replaceChildren()
        clipCount.textContent = `${clips.length}개`
        if (!clips.length) {
          const empty = document.createElement("p")
          empty.className = "clip-empty"
          empty.textContent = "저장된 클립이 없습니다"
          clipList.append(empty)
          releaseClipVideo()
          selectedClipName = ""
          return
        }

        let currentDate = ""
        let selectedClipFound = false
        for (const clip of clips) {
          const date = new Date(clip.modifiedAt)
          const dateLabel = date.toLocaleDateString("ko-KR", {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "short",
          })
          if (dateLabel !== currentDate) {
            currentDate = dateLabel
            const heading = document.createElement("div")
            heading.className = "clip-date"
            heading.textContent = dateLabel
            clipList.append(heading)
          }

          const item = document.createElement("div")
          item.className = "clip-item"
          const nameButton = document.createElement("button")
          nameButton.type = "button"
          nameButton.className = "clip-name"
          nameButton.textContent = clip.name.replace(/\.mp4$/i, "")
          const size = document.createElement("span")
          size.className = "clip-size"
          size.textContent = formatFileSize(clip.size)
          const time = document.createElement("span")
          time.className = "clip-time"
          time.textContent = date.toLocaleTimeString("ko-KR", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          })
          const meta = document.createElement("span")
          meta.className = "clip-meta"
          meta.append(time, size)
          const deleteButton = document.createElement("button")
          deleteButton.type = "button"
          deleteButton.className = "clip-delete"
          deleteButton.textContent = "삭제"
          item.append(nameButton, meta, deleteButton)
          item.addEventListener("click", event => {
            if (event.target === nameButton || event.target === deleteButton) return
            selectClip(clip, item)
          })
          item.addEventListener("dblclick", event => {
            if (event.target === nameButton || event.target === deleteButton) return
            void window.blackboxManager.openClip(clip.name)
          })
          nameButton.addEventListener("click", event => {
            event.stopPropagation()
            beginClipRename(clip, item, nameButton)
          })
          deleteButton.addEventListener("click", event => {
            event.stopPropagation()
            openClipDeleteModal(clip)
          })
          clipList.append(item)
          if (clip.name === selectedClipName || (!selectedClipName && clip === clips[0])) {
            selectedClipFound = true
            selectClip(clip, item)
          }
        }
        if (selectedClipName && !selectedClipFound) releaseClipVideo()
      }

      async function refreshClips() {
        try {
          renderClips(await window.blackboxManager.listClips())
        } catch (error) {
          clipCount.textContent = "불러오기 실패"
          clipMessage.classList.add("error")
          clipMessage.textContent = errorMessage(error)
        }
      }

      function showPage(page) {
        document.body.dataset.page = page
        for (const tab of pageTabs) {
          tab.classList.toggle("active", tab.dataset.page === page)
        }
        for (const panel of pagePanels) {
          panel.classList.toggle("active", panel.dataset.pagePanel === page)
        }
        if (page === "clips") {
          void refreshClips()
        }
        void window.blackboxManager.setPage(page).then(() => {
          if (page === "clips" && clipVideo.readyState >= 1) {
            window.requestAnimationFrame(() => {
              window.requestAnimationFrame(fitSavedClipMedia)
            })
          } else if (page === "extract") {
            window.requestAnimationFrame(() => {
              extractFrame.contentWindow.postMessage({
                source: "blackbox-manager-command",
                command: "fit-media",
              }, "*")
            })
          }
        })
      }

      for (const tab of pageTabs) {
        tab.addEventListener("click", () => showPage(tab.dataset.page))
      }

      clipVideo.addEventListener("loadedmetadata", fitSavedClipMedia)
      extractFrame.addEventListener("load", () => {
        if (status) render(status)
      })

      window.addEventListener("keydown", event => {
        if (event.code === "Escape" && document.activeElement === shortcutInput) {
          event.preventDefault()
          event.stopPropagation()
          disableShortcut()
          shortcutInput.blur()
          return
        }
        if (event.code === "Escape" && !clipDeleteModal.hidden) {
          event.preventDefault()
          closeClipDeleteModal()
          return
        }
        if (event.code === "Escape" && !clipSaveModal.hidden) {
          event.preventDefault()
          closeClipSaveModal()
          return
        }
        const editorCommand = {
          ArrowLeft: "seek-backward",
          ArrowRight: "seek-forward",
          Enter: "toggle-fullscreen",
          Space: "toggle-playback",
        }[event.code]
        if (
          !editorCommand
          || document.body.dataset.page !== "extract"
          || ["INPUT", "SELECT", "TEXTAREA"].includes(event.target?.tagName)
          || event.target?.isContentEditable
        ) return
        event.preventDefault()
        extractFrame.contentWindow.postMessage({
          source: "blackbox-manager-command",
          command: editorCommand,
        }, "*")
      })

      window.addEventListener("message", async event => {
        const data = event.data
        if (
          event.source !== extractFrame.contentWindow
          || data?.source !== "blackbox-editor"
        ) return
        const methods = window.blackboxManager.editor
        const allowedMethods = new Set([
          "getSession",
          "setEnabled",
          "fitMedia",
          "setTrackSeconds",
          "extract",
          "suggestClipName",
          "showOutput",
        ])
        try {
          if (!allowedMethods.has(data.method)) {
            throw new Error("허용되지 않은 블랙박스 편집 요청입니다")
          }
          const result = data.value === undefined
            ? await methods[data.method]()
            : await methods[data.method](data.value)
          event.source.postMessage({
            source: "blackbox-manager",
            id: data.id,
            result,
          }, "*")
        } catch (error) {
          event.source.postMessage({
            source: "blackbox-manager",
            id: data.id,
            error: errorMessage(error),
          }, "*")
        }
      })

      window.blackboxManager.onEditorExtractProgress(progress => {
        extractFrame.contentWindow.postMessage({
          source: "blackbox-manager-command",
          command: "extract-progress",
          value: progress,
        }, "*")
      })

      for (const input of settingInputs) {
        input.addEventListener("change", () => {
          settingsDirty = true
          saveSettingButton.disabled = busy
          renderSettingSummary()
        })
      }
      storagePathButton.addEventListener("click", async () => {
        try {
          const result = await window.blackboxManager.chooseClipStorage()
          if (result?.canceled || !result?.clipStoragePath) return
          storagePathInput.dataset.path = result.clipStoragePath
          storagePathInput.value = result.clipStoragePath
          storagePathInput.title = result.clipStoragePath
          settingsDirty = true
          saveSettingButton.disabled = busy
          message.classList.remove("error")
          message.textContent = "새 클립 저장 위치를 사용하려면 설정 저장을 눌러 주세요"
        } catch (error) {
          message.classList.add("error")
          message.textContent = errorMessage(error)
        }
      })
      cleanupRecordingButton.addEventListener("click", async () => {
        const result = await runAction(
          "모든 드라이브의 녹화 청크를 정리하고 있습니다",
          () => window.blackboxManager.clearRecording(),
        )
        message.classList.remove("error")
        message.textContent = result?.cleared
          ? "모든 드라이브의 녹화 청크를 정리했습니다"
          : ""
      })
      shortcutInput.addEventListener("focus", () => {
        shortcutInput.classList.add("capturing")
      })
      shortcutInput.addEventListener("blur", () => {
        shortcutInput.classList.remove("capturing")
      })
      shortcutInput.addEventListener("keydown", event => {
        event.preventDefault()
        event.stopPropagation()
        if (event.code === "Escape") {
          disableShortcut()
          shortcutInput.blur()
          return
        }
        const accelerator = shortcutFromKeyboardEvent(event)
        if (!accelerator) {
          if (["ControlLeft", "ControlRight", "AltLeft", "AltRight", "ShiftLeft", "ShiftRight", "MetaLeft", "MetaRight"].includes(event.code)) return
          message.classList.add("error")
          message.textContent = "Ctrl, Alt, Shift 중 하나와 일반 키를 함께 눌러 주세요"
          return
        }
        shortcutInput.dataset.accelerator = accelerator
        shortcutInput.value = shortcutLabel(accelerator)
        settingsDirty = true
        saveSettingButton.disabled = busy
        message.classList.remove("error")
        message.textContent = "새 단축키를 사용하려면 설정 저장을 눌러 주세요"
      })

      window.blackboxManager.onEscapePressed(() => {
        if (
          document.activeElement === shortcutInput
          || shortcutInput.classList.contains("capturing")
        ) {
          disableShortcut()
          shortcutInput.blur()
          return
        }
        if (!clipDeleteModal.hidden) {
          closeClipDeleteModal()
          return
        }
        if (!clipSaveModal.hidden) {
          closeClipSaveModal()
          return
        }
        void window.blackboxManager.requestClose()
      })

      saveSettingButton.addEventListener("click", async () => {
        const result = await runAction(
          "블랙박스 설정을 저장하고 있습니다",
          () => window.blackboxManager.setSetting(draftSetting()),
        )
        if (result) {
          settingsDirty = false
          if (result.enabled && !result.shortcutAvailable) {
            message.classList.add("error")
            message.textContent = `${result.shortcut} 단축키를 다른 프로그램이 사용 중입니다`
          } else {
            message.classList.remove("error")
            message.textContent = "블랙박스 설정을 저장했습니다"
          }
        }
      })

      saveClipButton.addEventListener("click", () => {
        void openClipSaveModal()
      })
      clipSaveCancelButton.addEventListener("click", closeClipSaveModal)
      clipSaveModal.addEventListener("pointerdown", event => {
        if (!clipSaveDialog.contains(event.target)) closeClipSaveModal()
      })
      clipDeleteCancelButton.addEventListener("click", closeClipDeleteModal)
      clipDeleteModal.addEventListener("pointerdown", event => {
        if (!clipDeleteDialog.contains(event.target)) closeClipDeleteModal()
      })
      clipDeleteDialog.addEventListener("submit", event => {
        event.preventDefault()
        const clip = pendingDeleteClip
        pendingDeleteClip = null
        clipDeleteModal.hidden = true
        if (clip) void removeClip(clip)
      })
      clipSaveDialog.addEventListener("submit", async event => {
        event.preventDefault()
        const clipName = clipSaveNameInput.value.trim()
          || clipSaveModal.dataset.fallbackName
        clipSaveModal.hidden = true
        const result = await runAction(
          `최근 약 ${status.clipSeconds}초 클립을 저장하고 있습니다`,
          () => window.blackboxManager.saveClip(clipName),
          "최근 클립을 저장했습니다",
          clipMessage,
        )
        if (result) await refreshClips()
      })

      closeButton.addEventListener("click", () => {
        closeButton.disabled = true
        void window.blackboxManager.requestClose()
      })

      window.blackboxManager.onSaveClipRequested(() => {
        void openClipSaveModal()
      })
      void refreshStatus()
      window.setInterval(() => {
        if (!busy) void refreshStatus(true)
      }, 1000)
    </script>
  </body>
</html>
