<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>디버프 누락 알림</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body:not(.configuring) { pointer-events: none }
    .panel {
      width: 100%;
      min-height: 100%;
      padding: 10px;
      border: 2px solid rgba(255, 78, 108, .95);
      border-radius: 8px;
      color: #fff;
      background: rgba(20, 22, 28, .92);
      box-shadow: 0 4px 18px rgba(0, 0, 0, .45);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      user-select: none;
    }
    body.configuring .panel { cursor: move }
    body.configuring button { cursor: pointer }
    h1 { margin: 0; font-size: 14px }
    .count { color: #ff8da2; font-size: 12px; font-weight: 700 }
    .items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layer {
      display: grid;
      grid-template-columns: 66px 1fr;
      min-height: 58px;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, .1);
    }
    .layer:first-child { padding-top: 0; border-top: 0 }
    .layer h2 {
      margin: 0;
      padding: 5px 6px 0 0;
      color: #ff91a5;
      font-size: 11px;
      font-weight: 700;
    }
    .layer-items {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 64px;
      min-height: 52px;
      padding: 2px;
      border: 1px solid rgba(255, 99, 127, .72);
      border-radius: 4px;
      background: #101217;
    }
    .item img {
      width: 30px;
      height: 30px;
      image-rendering: pixelated;
    }
    .item .name {
      width: 100%;
      margin-top: 2px;
      color: #fff;
      overflow: hidden;
      font-size: 9px;
      line-height: 12px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .layer-empty { padding-top: 14px; color: #737a86; font-size: 10px }
    .empty { color: #b7bdc8; font-size: 12px }
  </style>
</head>
<body>
  <section class="panel">
    <header>
      <h1>디버프 누락</h1>
      <span class="count"></span>
    </header>
    <div class="items"></div>
  </section>
  <script>
    const items = document.querySelector(".items")
    const count = document.querySelector(".count")
    const layers = [
      ["물리", [1, 3]],
      ["마법", [2, 3]],
      ["보너스", [4]],
      ["아르카나", [6]],
      ["이동속도", [5]],
    ]

    function createItem(debuff) {
      const item = document.createElement("div")
      item.className = "item"
      item.title = `${debuff.name} (${debuff.id})`
      const image = document.createElement("img")
      image.src = debuff.icon
      image.alt = debuff.name
      const name = document.createElement("span")
      name.className = "name"
      name.textContent = debuff.name
      item.append(image, name)
      return item
    }

    function render(status) {
      const configuring = status.debuffAlertConfiguring === true
      const missing = Array.isArray(status.missingDebuffs) ? status.missingDebuffs : []
      document.body.classList.toggle("configuring", configuring)
      count.textContent = configuring ? "위치 구성 중" : `${missing.length}개`
      if (missing.length === 0) {
        const empty = document.createElement("div")
        empty.className = "empty"
        empty.textContent = configuring ? "누락 디버프 아이콘이 이 영역에 표시됩니다." : "누락된 디버프가 없습니다."
        items.replaceChildren(empty)
        return
      }
      items.replaceChildren(...layers.map(([label, types]) => {
        const layer = document.createElement("section")
        layer.className = "layer"
        layer.setAttribute("aria-label", `${label} 누락 디버프`)
        const heading = document.createElement("h2")
        heading.textContent = label
        const layerItems = document.createElement("div")
        layerItems.className = "layer-items"
        const debuffs = missing.filter(debuff => types.includes(debuff.type))
        if (debuffs.length === 0) {
          const empty = document.createElement("span")
          empty.className = "layer-empty"
          empty.textContent = "없음"
          layerItems.append(empty)
        } else {
          layerItems.append(...debuffs.map(createItem))
        }
        layer.append(heading, layerItems)
        return layer
      }))
    }

    async function refresh() {
      try {
        render(await window.debuffAlert.getStatus())
      } catch {}
    }

    document.querySelector(".panel").addEventListener("mousedown", event => {
      if (!document.body.classList.contains("configuring") || event.button !== 0 || event.target.closest("button")) return
      window.debuffAlert.startDrag()
    })
    refresh()
    setInterval(refresh, 250)
  </script>
</body>
</html>
